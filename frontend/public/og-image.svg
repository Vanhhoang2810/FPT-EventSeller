<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Emerald radial glow (center-left) -->
    <radialGradient id="emeraldGlow" cx="35%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>

    <!-- Orange radial glow (upper-right) -->
    <radialGradient id="orangeGlow" cx="72%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#EA580C" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>

    <!-- Icon glow filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Lightning glow filter -->
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text glow filter -->
    <filter id="textGlow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle noise / grain overlay pattern -->
    <pattern id="grain" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <circle cx="1" cy="1" r="0.4" fill="#FAFAFA" fill-opacity="0.018"/>
      <circle cx="3" cy="3" r="0.4" fill="#FAFAFA" fill-opacity="0.012"/>
    </pattern>

    <!-- Icon background gradient (for the small dark square) -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2E1E"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════ BACKGROUND ═══════════════════════ -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="630" fill="url(#orangeGlow)"/>
  <!-- Subtle grain texture -->
  <rect width="1200" height="630" fill="url(#grain)" opacity="0.6"/>

  <!-- Decorative grid lines (very subtle) -->
  <g stroke="#10B981" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>

  <!-- ═══════════════════════ TICKET ICON (centered, ~4x scale) ═══════════════════════ -->
  <!-- Icon center at x=600, top area. Ticket ~160x72, centered at (600, 188) -->
  <g transform="translate(520, 152)">

    <!-- Icon dark background pill -->
    <rect x="-12" y="-16" width="184" height="104" rx="22" fill="url(#iconBg)" opacity="0.85"/>

    <!-- Ticket frame with emerald glow -->
    <g filter="url(#iconGlow)">
      <!-- Left stub fill -->
      <rect x="0" y="0" width="46" height="72" rx="10" fill="#10B981" fill-opacity="0.15"/>
      <!-- Main ticket outline -->
      <rect x="0" y="0" width="160" height="72" rx="10" fill="none" stroke="#10B981" stroke-width="5"/>
    </g>

    <!-- Left notch cutout -->
    <circle cx="0" cy="36" r="18" fill="#09090B"/>
    <!-- Right notch cutout -->
    <circle cx="160" cy="36" r="18" fill="#09090B"/>

    <!-- Left notch inner arc (clean edge) -->
    <path d="M 0,18 A 18,18 0 0 1 0,54" fill="none" stroke="#10B981" stroke-width="5" stroke-opacity="0.9"/>
    <!-- Right notch inner arc (clean edge) -->
    <path d="M 160,18 A 18,18 0 0 0 160,54" fill="none" stroke="#10B981" stroke-width="5" stroke-opacity="0.9"/>

    <!-- Perforation dashes -->
    <line x1="48" y1="0" x2="48" y2="72" stroke="#10B981" stroke-width="3" stroke-dasharray="5,5" opacity="0.6"/>

    <!-- Lightning bolt — centered in ticket (scaled up ~4x from favicon) -->
    <g filter="url(#boltGlow)">
      <path d="M 108,8 L 82,38 L 98,38 L 90,68 L 132,30 L 112,30 Z"
            fill="#F97316"/>
      <!-- Subtle inner highlight on bolt -->
      <path d="M 108,8 L 82,38 L 98,38 L 90,68 L 132,30 L 112,30 Z"
            fill="none" stroke="#FED7AA" stroke-width="1.5" stroke-opacity="0.4"/>
    </g>
  </g>

  <!-- ═══════════════════════ WORDMARK ═══════════════════════ -->
  <g filter="url(#textGlow)">
    <text
      x="600" y="338"
      font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
      font-size="96"
      font-weight="900"
      text-anchor="middle"
      letter-spacing="-2">
      <tspan fill="#10B981">Ticket</tspan><tspan fill="#F97316"> Rush</tspan>
    </text>
  </g>

  <!-- ═══════════════════════ TAGLINE ═══════════════════════ -->
  <text
    x="600" y="396"
    font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="28"
    font-weight="400"
    fill="#A1A1AA"
    text-anchor="middle"
    letter-spacing="0.5">
    Đặt vé sự kiện nhanh nhất Việt Nam
  </text>

  <!-- Divider line -->
  <line x1="480" y1="440" x2="720" y2="440" stroke="#27272A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Two small emerald dots on the divider ends -->
  <circle cx="480" cy="440" r="2.5" fill="#10B981" fill-opacity="0.5"/>
  <circle cx="720" cy="440" r="2.5" fill="#F97316" fill-opacity="0.5"/>

  <!-- Domain -->
  <text
    x="600" y="484"
    font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="22"
    font-weight="500"
    fill="#52525B"
    text-anchor="middle"
    letter-spacing="1">
    ticketrush.vn
  </text>

  <!-- Bottom border accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="none"/>
  <line x1="0" y1="624" x2="480" y2="624" stroke="#10B981" stroke-width="2.5" stroke-opacity="0.35"/>
  <line x1="480" y1="624" x2="720" y2="624" stroke="#F97316" stroke-width="2.5" stroke-opacity="0.5"/>
  <line x1="720" y1="624" x2="1200" y2="624" stroke="#10B981" stroke-width="2.5" stroke-opacity="0.35"/>
</svg>
